<button
  type="button"
  class="contexto-dialog__scrim"
  aria-label="Cerrar selector de contexto"
  (click)="cerrar.emit()"
></button>

<section
  #panel
  class="contexto-dialog__panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="contexto-dialog-title"
  tabindex="-1"
>
  <header class="contexto-dialog__head">
    <div class="contexto-dialog__text">
      <span class="et-eyebrow">Contexto</span>
      <h2 id="contexto-dialog-title">Cambiar empresa y negocio</h2>
      <p>El cambio se aplica sólo a esta solapa del navegador.</p>
    </div>
    <button
      type="button"
      class="contexto-dialog__close"
      aria-label="Cerrar"
      (click)="cerrar.emit()"
    >
      <et-icon name="close" [size]="18" />
    </button>
  </header>

  <et-contexto-selector
    [empresas]="empresas()"
    [empresaActivaId]="empresaActivaId()"
    [negocioActivoId]="negocioActivoId()"
    [permitirSalir]="false"
    (seleccionar)="seleccionar.emit($event)"
  />
</section>
